[package]
name = "gocode"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
gocode-agent = { path = "../gocode-agent" }
gocode-credentials = { path = "../gocode-credentials" }
gocode-core = { path = "../gocode-core" }
gocode-mcp = { path = "../gocode-mcp" }
gocode-provider-nvidia = { path = "../gocode-provider-nvidia" }
gocode-tools = { path = "../gocode-tools" }
gocode-tui = { path = "../gocode-tui" }
gocode-updater = { path = "../gocode-updater" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
semver = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "fs"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["json"] }

[lints]
workspace = true
