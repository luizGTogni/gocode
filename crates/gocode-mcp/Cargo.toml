[package]
name = "gocode-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64 = "0.22"
futures-util = "0.3"
gocode-core = { path = "../gocode-core" }
gocode-credentials = { path = "../gocode-credentials" }
gocode-tools = { path = "../gocode-tools" }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["process", "net", "sync", "rt", "io-util", "macros", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "net", "sync", "io-util", "time"] }

[lints]
workspace = true
