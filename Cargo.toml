[workspace]
members = [
    "crates/gocode",
    "crates/gocode-agent",
    "crates/gocode-credentials",
    "crates/gocode-core",
    "crates/gocode-mcp",
    "crates/gocode-provider-nvidia",
    "crates/gocode-tools",
    "crates/gocode-tui",
    "crates/gocode-updater",
]
resolver = "3"

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/gocode/gocode"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
